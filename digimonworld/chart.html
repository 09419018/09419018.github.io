<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pedrito is the best (es el mejor)</title>
<style>
  body {
    background-color: #111;
    color: white;
    text-align: center;
  }
  #mainImage {
    cursor: pointer;
    max-width: 90%;
    height: auto;
  }
  #popup {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
  }
  #popup img {
    max-width: 80%;
    max-height: 80%;
  }
  #Pedro{
   color:red;position: absolute;margin-top:-37em;margin-left:69em;transition: color 2s;
  }
  #Pedro:hover{
      color:blue;
  }

</style>
</head>
<body>


<img id="mainImage" src="gif/chart.png" alt="Imagen principal">
<p onclick="myFunction()" id='Pedro'> Pedro </p>
<div id="popup" >
  <img src="gif/c1.png" alt="Imagen emergente" onmouseover='closeImage()'>
</div>

<script>
 const mainImage = document.getElementById("mainImage");
 const popup = document.getElementById("popup");
function myFunction() {
  popup.style.display = "flex";
}
function closeImage() {
  popup.style.display = "none";
}
</script>

</body>
</html>
