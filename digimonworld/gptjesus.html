</div>

<script>
const clickableAreas = [
  { name: 'Cacamon', x1: 130, y1: 189,     image: 'gif/c1.png' },
  { name: 'Middle box',  x1: 300, y1: 200, image: 'gif/c1.png' },
  { name: 'Bottom box',  x1: 200, y1: 400, image: 'gif/c1.png' }
];


const img = document.getElementById('myImage');


img.addEventListener('click', function(event) {
  // Find click position relative to image
  const rect = img.getBoundingClientRect();
  const x = event.clientX - rect.left;
  const y = event.clientY - rect.top;

//   let found = false;
  for (const area of clickableAreas) {
    if (x >= area.x1 && x <= area.x1 + 86 && y >= area.y1 && y <= area.y1 + 85) {
      showPopup(area.image);
    //   found = true;
      break;
    }
  }

//   if (!found) {
//     showPopup(`Clicked at (${x}, ${y}) — no special action`);
//   }
});


function showPopup(image) {
  document.getElementById('popup-image').src = image;
  document.getElementById('popup').style.display = 'block';
  document.getElementById('popup').style.flexDirection = 'column';
}
function closePopup() {
  document.getElementById('popup').style.display = 'none';
}
</script>

</body>
</html>
